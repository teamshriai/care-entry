<!doctype html>
<!-- Care Entry entry page for the Patient Self-Registration portal (served at /patient-self-registration).
     Mirrors ../../patient-self-registration/demo.html; its script loads the portal's own source via demo-main.ts. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="A walkthrough of registering with SHRI HEALTH using Aadhaar or ABHA verification, using sample data only." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SHRI HEALTH · Aadhaar / ABHA identity demo</title>
    <meta name="theme-color" content="#E8EDF4" />
    <script>
      // Applies the saved theme before first paint so there is no flash of the
      // other theme. Light is the default; keep the key in sync with
      // src/ui/useTheme.ts.
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('shri-theme-v3') === 'dark';
        } catch (e) {
          /* Blocked storage — light is the correct fallback. */
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#14181F' : '#E8EDF4');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/patient-self-registration/demo-main.ts"></script>
  </body>
</html>
